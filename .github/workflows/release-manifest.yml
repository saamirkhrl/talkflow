# Keeps talkflow-release.json on each GitHub release in step with the assets
# attached to it. See docs/releases.md.
#
# Runs scripts/release-manifest.py --upload, which only reads the release and
# replaces its talkflow-release.json asset. It never creates a release or a
# tag and never removes any other asset. release.sh attaches the Mac files when
# it creates the release, so the "published" event sees all of them.
name: Release manifest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)generate the manifest for, e.g. v0.1.4"
        required: true

permissions: {}

concurrency:
  group: release-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write # read the release, upload the manifest asset
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pick the release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
            release) tag="$RELEASE_TAG" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
          esac
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag: '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate and upload talkflow-release.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 scripts/release-manifest.py "$TAG" --upload --out "$RUNNER_TEMP/talkflow-release.json"
          cat "$RUNNER_TEMP/talkflow-release.json"
